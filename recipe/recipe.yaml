# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"
  python_min: "3.12"

package:
  name: solvor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/solvor/solvor-${{ version }}.tar.gz
  sha256: 60f25f37fb9d6783e80c685419a889ca5d6e3bd725b4dce2f9d66ee5af83f1fe

build:
  number: 0
  script:
    - pushd rust && cargo-bundle-licenses --format yaml --output ../THIRDPARTY.yml && popd
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python ${{ python_min }}.*
    - pip
    - maturin >=1.7,<2.0
  run:
    - python

tests:
  - python:
      imports:
        - solvor
      pip_check: true

about:
  homepage: https://solvOR.ai
  repository: https://github.com/StevenBtw/solvOR
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Solvor all your optimization needs
  description: |
    solvor is a Rust-implemented optimization toolkit with Python
    bindings (PyO3 + maturin). It bundles linear-programming, SAT,
    and metaheuristics solvers under a single Python API, targeted
    at operations-research workloads.

extra:
  recipe-maintainers:
    - rxm7706
    - jsmolic
